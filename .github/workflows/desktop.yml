name: Desktop apps

on:
  push:
    branches: [PRODUCTION]
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: desktop/app/dist
      - run: mkdir -p build && cp ../public/icon-512.png build/icon.png
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version=$APP_VERSION
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}
          name: GP200 Studio ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
